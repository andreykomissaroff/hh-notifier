name = "hh-notifier"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Workers AI: онбординг (извлечение профиля из резюме). Бесплатный тариф покрывает с запасом.
# При деплое через dashboard: Settings -> Bindings -> Add -> Workers AI -> имя переменной AI.
[ai]
binding = "AI"

# ретроспективные логи в dashboard (3 дня) — для разбора инцидентов доставки
[observability]
enabled = true

# cron по UTC: запуск каждые 5 минут с 03:00 до 18:55 — но прогон выполняет ровно
# один слот в час, в случайную минуту ±10 от часа (джиттер в src/index.js, cronJitterMs);
# окно прогонов 07:00–21:00 МСК. Холостые запуски бесплатны и hh.ru не трогают.
[triggers]
crons = ["*/5 3-18 * * *"]

# KV для дедупликации; id после создания namespace:
#   wrangler kv namespace create STATE  ->  вставьте id ниже
# (при деплое через dashboard binding создаётся в UI, этот блок не нужен)
[[kv_namespaces]]
binding = "STATE"
id = "76401932f33845cebbd05fa530681e6b"

[vars]
TELEGRAM_CHAT_ID = "983824287"
# токен бота сюда НЕ вписываем: wrangler secret put TELEGRAM_BOT_TOKEN
# (или в dashboard: Settings -> Variables -> Secret)
